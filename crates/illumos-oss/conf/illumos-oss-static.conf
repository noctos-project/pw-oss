# One fixed playback sink on /dev/dsp, for running without a session manager.
# Copy to ~/.config/pipewire/pipewire.conf.d/ (or the system equivalent).
# With WirePlumber the device monitor creates nodes instead; do not use both.

context.spa-libs = {
    illumos-oss.* = libspa_illumos_oss
}

context.objects = [
    { factory = adapter
      args = {
          factory.name             = illumos-oss.sink
          node.name                = "illumos-oss.dsp.playback"
          node.description         = "illumos audio (/dev/dsp)"
          media.class              = "Audio/Sink"
          api.illumos-oss.dsp-path = "/dev/dsp"
          adapter.auto-port-config = { mode = dsp monitor = false position = preserve }
      }
    }
]
