# WirePlumber side of the illumos backend. Install in wireplumber.conf.d,
# with share/wireplumber/scripts/monitors/illumos-oss.lua in WirePlumber's
# script directory.

context.spa-libs = {
    illumos-oss.* = libspa_illumos_oss
}

wireplumber.components = [
  {
    name     = monitors/illumos-oss.lua
    type     = script/lua
    provides = monitor.illumos-oss
    requires = [ support.export-core, pw.client-device ]
  },
  {
    type     = virtual
    provides = hardware.audio
    wants    = [ monitor.illumos-oss ]
  }
]

# Things that only exist on Linux. Left enabled they are harmless but each
# logs a failure at every start.
wireplumber.profiles = {
  main = {
    monitor.alsa           = disabled
    monitor.alsa-midi      = disabled
    hardware.bluetooth     = disabled
    hardware.video-capture = disabled
    support.logind         = disabled
  }
}
